name: Test notification email

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-email:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send one clearly labelled test email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          node --input-type=module <<'JS'
          const { RESEND_API_KEY, EMAIL_FROM, EMAIL_TO, GITHUB_RUN_ID, GITHUB_RUN_ATTEMPT } = process.env;
          if (!RESEND_API_KEY || !EMAIL_FROM || !EMAIL_TO) {
            console.error('Email configuration is incomplete.');
            process.exit(1);
          }
          try {
            const response = await fetch('https://api.resend.com/emails', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${RESEND_API_KEY}`,
                'Content-Type': 'application/json',
                'Idempotency-Key': `codex-reset-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}`
              },
              body: JSON.stringify({
                from: EMAIL_FROM,
                to: EMAIL_TO.split(',').map(value => value.trim()).filter(Boolean),
                subject: 'Codex 重置提醒｜邮箱连通测试',
                text: '这是一封配置测试邮件，不代表 Codex 额度已经重置。\n\n收到本邮件说明：你的 GitHub Actions 已能通过 Resend 将通知发送到此邮箱。监控启用后，将检查 @thsottiaux 的公开动态，发现新的重置相关信号时发送邮件；不监测个人账户的额度倒计时。\n\n仓库：https://github.com/gbouo2007-crypto/codex-reset-signal\n检查计划：约每 5 分钟，GitHub 调度可能延迟。\n显示时区：Asia/Shanghai。'
              }),
              signal: AbortSignal.timeout(20000),
              redirect: 'error'
            });
            if (!response.ok) {
              console.error(`Resend rejected the test email: HTTP ${response.status}`);
              process.exit(1);
            }
            const result = await response.json();
            console.log(`Test email accepted; message ID: ${result.id}`);
          } catch {
            console.error('Email request failed or timed out.');
            process.exit(1);
          }
          JS
